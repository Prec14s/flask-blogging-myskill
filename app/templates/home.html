{% extends 'base.html' %}

{% block title %}Home{% endblock %}


{% block content %}
<div class="flex items-center justify-between m-5">
    <h1 class="text-2xl font-bold text-gray-900">
        Hello, {{ session.get('username', 'Guest') }}!
    </h1>

    {% if session.get('user_id') %}
        <a href="{{ url_for('user.logout') }}"
           class="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 focus:ring-4 focus:ring-red-300">
            Logout
        </a>
    {% else %}
        <a href="{{ url_for('user.login') }}"
           class="px-4 py-2 text-sm font-medium text-white bg-blue-700 rounded-lg hover:bg-blue-800 focus:ring-4 focus:ring-blue-300">
            Login
        </a>
    {% endif %}
</div>

{% include 'posts.html' %}

{% endblock %}
