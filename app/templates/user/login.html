{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[80vh]">
    <div class="w-full max-w-md p-8 bg-white border border-gray-200 rounded-lg shadow">
        <h1 class="mb-6 text-2xl font-bold text-gray-900">Masuk ke akun kamu</h1>

        <form method="POST" action="{{ url_for('user.login') }}" class="space-y-4">
            <div>
                <label for="username" class="block mb-2 text-sm font-medium text-gray-900">Username</label>
                <input type="text" name="username" id="username" required
                       class="w-full p-2.5 text-sm text-gray-900 border border-gray-300 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500"
                       placeholder="username">
            </div>
            <div>
                <label for="password" class="block mb-2 text-sm font-medium text-gray-900">Password</label>
                <input type="password" name="password" id="password" required
                       class="w-full p-2.5 text-sm text-gray-900 border border-gray-300 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500"
                       placeholder="••••••••">
            </div>
            <button type="submit"
                    class="w-full px-5 py-2.5 text-sm font-medium text-white bg-blue-700 rounded-lg hover:bg-blue-800 focus:ring-4 focus:ring-blue-300">
                Login
            </button>
            <p class="text-sm text-gray-500">
                Belum punya akun?
                <a href="{{ url_for('user.register') }}" class="font-medium text-blue-600 hover:underline">Daftar di sini</a>
            </p>
        </form>
    </div>
</div>
{% endblock %}
